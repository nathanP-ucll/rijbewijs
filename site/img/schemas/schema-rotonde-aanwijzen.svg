<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Op de rotonde: oprijden en verlaten</title>
<desc id="d">Bovenaanzicht van een rotonde met vier armen. Een rode auto rijdt de rotonde op zonder richtingaanwijzer. Een blauwe auto verlaat de rotonde met de rechter richtingaanwijzer aan.</desc>

