<text x="215" y="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="215" dy="0">Oprijden: je hoeft geen</tspan><tspan x="215" dy="18.88">richtingaanwijzer te gebruiken</tspan></text>
