<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Pech op een overweg: eerst uit, dan bellen</title>
<desc id="d">Een auto staat stil op de sporen van een overweg met zijn alarmlichten aan. Drie stappen: de inzittenden stappen uit, lopen weg van de sporen naar een veilige plaats achter de slagbomen, en bellen daarna het gratis noodnummer 1711 met de locatie die bij de overweg staat.</desc>
