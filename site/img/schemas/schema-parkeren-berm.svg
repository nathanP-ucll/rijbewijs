<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Parkeren op de berm: 1,50 m doorgang voor voetgangers</title>
<desc id="d">Een straat met een gelijkgrondse berm waarop een auto geparkeerd staat. Tussen de auto en de buitenrand van de weg blijft minstens 1,50 meter vrij voor voetgangers (aangeduid met een dubbele pijl).</desc>

