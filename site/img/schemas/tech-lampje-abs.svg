<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-labelledby="t d">
<title id="t">Dashboardlampje ABS</title>
<desc id="d">De letters ABS in een cirkel tussen haakjes op een donker dashboardvlak: storing in het antiblokkeersysteem. De kleur verschilt per bron, daarom neutraal getekend.</desc>

<rect width="200" height="220" rx="22" fill="#171b22"/>
<rect x="6" y="6" width="188" height="208" rx="18" fill="none" stroke="#2c323d" stroke-width="2"/>
<g transform="translate(100 100) scale(2.1) translate(-32 -32)"><g fill="none" stroke="#d4dae4" stroke-width="3.6" stroke-linecap="round"><circle cx="32" cy="32" r="14"/><path d="M13 20 A22 22 0 0 0 13 44"/><path d="M51 20 A22 22 0 0 1 51 44"/></g><text x="32" y="36.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#d4dae4">ABS</text></g>
<text x="100" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8ecf3" text-anchor="middle" ><tspan x="100" dy="0">ABS</tspan></text>
<text x="100" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#9aa3b2" text-anchor="middle" ><tspan x="100" dy="0">kleur verschilt per merk</tspan></text>
</svg>
