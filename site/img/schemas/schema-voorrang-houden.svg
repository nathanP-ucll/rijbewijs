<text x="600" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="600" dy="0">stopt even,</tspan><tspan x="600" dy="20.06">maar houdt voorrang</tspan></text>
<rect x="141.04" y="501" width="217.92" height="50.12" rx="9" fill="#d63a3a"  opacity="0.95"/>
<text x="250" y="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="250" dy="0">wacht: de blauwe auto</tspan><tspan x="250" dy="20.06">behoudt zijn voorrang</tspan></text>
<rect x="0" y="0" width="800" height="66" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Even stoppen kost je geen voorrang</tspan></text>
<text x="400" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#d6dbe6" text-anchor="middle" ><tspan x="400" dy="0">de blauwe auto komt van rechts</tspan></text>
