<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Wie voorrang heeft en even stopt, behoudt zijn voorrang</title>
<desc id="d">Een kruispunt zonder borden of lichten. De blauwe auto komt van rechts en heeft voorrang, maar staat even stil voor het kruispunt (remlichten). De rode auto uit de onderste weg wacht: de blauwe auto behoudt zijn voorrang.</desc>

