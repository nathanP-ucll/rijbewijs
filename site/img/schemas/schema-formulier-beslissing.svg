<title id="t">Wanneer volstaat het formulier niet?</title>
<desc id="d">Beslissingsschema met de vraag wat er gebeurd is en drie antwoorden. Enkel blikschade: formulier samen invullen. Gewonden: 112 bellen, politie erbij, proces-verbaal. Onbekende of onverzekerde tegenpartij: vraag uitleg aan je verzekeraar.</desc>

