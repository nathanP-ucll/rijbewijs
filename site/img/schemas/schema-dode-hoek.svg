<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Dode hoek van een vrachtwagen</title>
<desc id="d">Een vrachtwagen van bovenaf, rijdend naar boven, met drie gearceerde oranje zones waar de bestuurder niet goed kan zien: een zone vlak voor de cabine, een lange zone langs de rechterzijde en een kleinere zone links. Een fietser rijdt rechts naast de vrachtwagen in de dode hoek. De zones zijn schematisch, niet op schaal.</desc>

<rect width="800" height="600" fill="#86b96b"/>
<rect x="250" y="0" width="300" height="600" fill="#4a4f57" />
<line x1="400" y1="0" x2="400" y2="600" stroke="#fff" stroke-width="3" stroke-dasharray="16 14"/>
<rect x="501" y="310" width="60" height="190" rx="8" fill="rgba(255,140,0,.38)" stroke="#ff8c00" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="455" y="205" width="60" height="95" rx="8" fill="rgba(255,140,0,.38)" stroke="#ff8c00" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="405" y="330" width="54" height="90" rx="8" fill="rgba(255,140,0,.38)" stroke="#ff8c00" stroke-width="3" stroke-dasharray="8 6"/>
<g transform="translate(480 360) rotate(0)"><rect x="-19" y="-58" width="38" height="28" rx="6" fill="#2f6fd6" stroke="#1c2230" stroke-width="2.5"/><rect x="-13" y="-52" width="26" height="9" rx="3" fill="#cfe6f7" stroke="#1c2230" stroke-width="1.2"/><rect x="-21" y="-28" width="42" height="86" rx="3" fill="#f1f1ee" stroke="#1c2230" stroke-width="2.5"/></g>
<g transform="translate(535 400) rotate(0)"><rect x="-3" y="-20" width="6" height="40" rx="3" fill="#333" stroke="#fff" stroke-width="1.2"/><line x1="-11" y1="-13" x2="11" y2="-13" stroke="#333" stroke-width="3" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="10" ry="6" fill="#e0782a" stroke="#fff" stroke-width="1.5"/><circle cx="0" cy="-3" r="5.5" fill="#f1c9a5" stroke="#1c2230" stroke-width="1.5"/></g>
<rect x="569.84" y="381" width="170.32" height="90.24" rx="9" fill="#fff"  opacity="0.95"/>
<text x="655" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="655" dy="0">Fietser rechts</tspan><tspan x="655" dy="20.06">naast de vracht-</tspan><tspan x="655" dy="20.06">wagen: niet</tspan><tspan x="655" dy="20.06">zichtbaar</tspan></text>
<rect x="60.32" y="281" width="189.36" height="70.18" rx="9" fill="#fff"  opacity="0.95"/>
<text x="155" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="155" dy="0">Rechts afslaan:</tspan><tspan x="155" dy="20.06">spiegels én over</tspan><tspan x="155" dy="20.06">de schouder kijken</tspan></text>
<rect x="374.4" y="173" width="211.2" height="27.7" rx="9" fill="#fff"  opacity="0.95"/>
<text x="480" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="480" dy="0">ook vlak voor de cabine</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Dode hoek: de chauffeur ziet je niet</tspan></text>
</svg>
