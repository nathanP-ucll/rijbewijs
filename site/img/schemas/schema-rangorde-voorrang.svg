<title id="t">Rangorde: wie of wat bepaalt de voorrang?</title>
<desc id="d">Een trap met vier treden van boven naar onder: 1 bevoegde persoon, 2 verkeerslichten, 3 verkeersborden, 4 algemene verkeersregels (voorrang van rechts). Wat hoger staat, gaat voor wat lager staat.</desc>
