<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 429" width="800" height="429" role="img" aria-labelledby="t d">
<title id="t">Wat vertel je bij een noodoproep?</title>
<desc id="d">Vier kaarten: waar (de exacte locatie), wat (wat er gebeurd is en hoeveel voertuigen), wie (gewonden, hoeveel en hoe ze eraan toe zijn) en jij (wie je bent). Onder: op de autosnelweg geef je kilometerpaal, dichtstbijzijnde afrit en rijrichting; op een gewone weg gemeente, straat of kruispunt. Hang niet op voor de operator klaar is.</desc>

