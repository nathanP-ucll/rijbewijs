<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Kruisen: rechts, met voldoende zijdelingse afstand</title>
<desc id="d">Twee auto's kruisen elkaar op een tweerichtingsweg. Elk blijft rechts en houdt een ruime zijdelingse afstand tot de tegenligger (aangeduid met een dubbele pijl). Rechts langs de weg staat een geparkeerde auto als hindernis; de auto op die kant vertraagt.</desc>
