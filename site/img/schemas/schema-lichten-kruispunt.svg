<title id="t">Kruispunt met lichten: niet oprijden als je er vast komt te staan</title>
<desc id="d">Een kruispunt met verkeerslichten. Auto 1 heeft groen en staat vlak voor het kruispunt, maar de weg aan de overkant staat vol: drie auto's staan er stil in de file. Auto 1 mag het kruispunt niet oprijden want hij zou er blijven staan en het dwarsverkeer hinderen. Het dwarsverkeer heeft rood maar zou anders niet kunnen doorrijden.</desc>
