<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Een fietser voorbijrijden: 1 m of 1,5 m afstand</title>
<desc id="d">Twee wegen naast elkaar, van onder naar boven. Links: binnen de bebouwde kom rijdt een auto een fietser voorbij met minstens 1 meter zijdelingse afstand. Rechts: buiten de bebouwde kom is de afstand minstens 1,5 meter. De afstanden zijn niet op schaal getekend.</desc>
