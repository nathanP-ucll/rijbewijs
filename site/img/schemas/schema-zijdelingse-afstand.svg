<text x="400" y="585" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Niet op schaal. Past het niet? Dan haal je niet in.</tspan></text>
