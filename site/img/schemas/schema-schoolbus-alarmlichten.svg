<title id="t">Schoolbus met knipperende richtingaanwijzers</title>
<desc id="d">Een schoolbus staat langs de weg met alle vier de richtingaanwijzers knipperend (oranje stralen). Op het trottoir staan drie kinderen. Een auto komt van achteren en vertraagt sterk; zijn remlichten branden.</desc>
