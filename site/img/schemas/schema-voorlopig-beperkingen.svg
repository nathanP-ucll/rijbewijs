<text x="589.5" y="380.64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="589.5" dy="0">Het hele Belgische grondgebied, maar niet in</tspan><tspan x="589.5" dy="18.91">het buitenland.</tspan></text>
