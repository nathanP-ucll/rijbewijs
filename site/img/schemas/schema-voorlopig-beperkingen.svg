<title id="t">Wat mag je niet met een voorlopig rijbewijs?</title>
<desc id="d">Vijf pictogrammen. Een L-teken staat goed zichtbaar op de achterruit. Niet rijden van 22 u tot 6 u op vrijdag, zaterdag, zondag, de vooravond van een feestdag en op feestdagen. Geen commercieel goederenvervoer. Geen aanhangwagen. Enkel rijden in België.</desc>

