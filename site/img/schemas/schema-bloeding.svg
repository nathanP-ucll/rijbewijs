<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 441" width="800" height="441" role="img" aria-labelledby="t d">
<title id="t">Ernstige bloeding en bloedneus</title>
<desc id="d">Vier stappen bij een ernstige bloeding: handschoenen aan en het slachtoffer laten neerliggen, 112 alarmeren, 10 minuten op de wonde drukken met een drukverband of propere doek, blijven drukken tot de hulpdiensten aankomen. Onder: bij een bloedneus voorovergebogen zitten en de neus 10 minuten dichtknijpen.</desc>

