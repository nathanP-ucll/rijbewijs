<title id="t">Slagen: definitief rijbewijs en terugkommoment</title>
<desc id="d">Drie stappen na een geslaagd praktijkexamen: je krijgt het formulier Aanvraag om een rijbewijs (3 jaar geldig, maar nog geen rijbewijs), je vraagt het rijbewijs aan bij je gemeente of via BelDrive en daarna volgt het verplichte terugkommoment van 4 uur, 6 tot 9 maanden na je definitieve rijbewijs.</desc>

