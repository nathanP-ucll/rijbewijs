<text x="658" y="190.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="658" dy="0">Verplicht: 4 uur, 6 tot 9</tspan><tspan x="658" dy="19.52">maanden na je definitieve</tspan><tspan x="658" dy="19.52">rijbewijs.</tspan></text>
