<title id="t">Het aanrijdingsformulier</title>
<desc id="d">Een schets van een leeg aanrijdingsformulier met twee kolommen voor partij A en partij B, een schetsvak en twee handtekeningvakken, zonder ingevulde waarden. Rechts uitleg: de voorzijde vul je samen in en onderteken je, de keerzijde vul je apart in, op papier of in de Crashform-app, en feiten vermelden is geen erkenning van aansprakelijkheid.</desc>

