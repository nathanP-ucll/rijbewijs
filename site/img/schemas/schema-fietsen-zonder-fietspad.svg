<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Fietsen zonder fietspad</title>
<desc id="d">Twee bovenaanzichten van een straat zonder fietspad. Boven: twee fietsers rijden naast elkaar dicht bij de rechterrand van de rijbaan, dat mag. Onder: er komt een auto aan en kruisen is niet mogelijk, dus rijden de fietsers achter elkaar.</desc>
