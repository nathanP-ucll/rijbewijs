<text x="400" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#d6dbe6" text-anchor="middle" ><tspan x="400" dy="0">fietsers rijden op de rijbaan, dicht bij de rechterrand</tspan></text>
