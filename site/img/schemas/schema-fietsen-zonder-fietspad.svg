<text x="400" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Er komt niemand aan: twee naast elkaar mag.</tspan></text>
