<title id="t">Een tram in de rijbaan haal je rechts in</title>
<desc id="d">Een straat met een tramspoor in het midden. Een tram staat stil aan een halte. Een auto rijdt rechts langs de tram voorbij (groen vinkje). Links langs de tram voorbijrijden is fout (rood kruis); links is de rijstrook van het tegemoetkomende verkeer, waar een tegenligger rijdt.</desc>
