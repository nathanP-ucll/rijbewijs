<text x="662" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5b6577" text-anchor="middle" ><tspan x="662" dy="0">Zoals groen:</tspan><tspan x="662" dy="17.7">doorrijden toegelaten</tspan></text>
<rect x="20" y="306" width="236" height="218" rx="14" fill="#fff" stroke="#c9d1de" stroke-width="2"/>
