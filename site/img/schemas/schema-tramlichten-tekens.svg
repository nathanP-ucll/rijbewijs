<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Tramlichten: witte tekens op een zwarte achtergrond</title>
<desc id="d">Overzicht van zes tramlichten, elk een wit teken op een zwart vierkant: horizontale balk (zoals rood: stoppen), cirkel (zoals oranje: stoppen tenzij het niet meer veilig kan), omgekeerde driehoek (zoals groen: doorrijden toegelaten), verticale balk (enkel rechtdoor), schuine balk (enkel in de richting van de balk) en knipperende cirkel (zoals oranje knipperlicht).</desc>

<rect width="800" height="600" fill="#e9edf3"/>
<rect x="20" y="76" width="236" height="218" rx="14" fill="#fff" stroke="#c9d1de" stroke-width="2"/>
<rect x="34" y="282" width="208" height="6" rx="3" fill="#d63a3a"/>
<rect x="90" y="90" width="96" height="96" rx="14" fill="#14171d" stroke="#000" stroke-width="3"/>
<rect x="106" y="131" width="64" height="14" fill="#ffffff" rx="3"/>
<text x="138" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="138" dy="0">Horizontale balk</tspan></text>
<text x="138" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5b6577" text-anchor="middle" ><tspan x="138" dy="0">Zoals rood:</tspan><tspan x="138" dy="17.7">stoppen</tspan></text>
<rect x="282" y="76" width="236" height="218" rx="14" fill="#fff" stroke="#c9d1de" stroke-width="2"/>
<rect x="296" y="282" width="208" height="6" rx="3" fill="#f08a1c"/>
<rect x="352" y="90" width="96" height="96" rx="14" fill="#14171d" stroke="#000" stroke-width="3"/>
<circle cx="400" cy="138" r="26" fill="#ffffff" />
<text x="400" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Cirkel</tspan></text>
<text x="400" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5b6577" text-anchor="middle" ><tspan x="400" dy="0">Zoals oranje: stoppen,</tspan><tspan x="400" dy="17.7">tenzij dat niet meer</tspan><tspan x="400" dy="17.7">veilig kan</tspan></text>
