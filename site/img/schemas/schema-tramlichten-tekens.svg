<text x="138" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5b6577" text-anchor="middle" ><tspan x="138" dy="0">Enkel rechtdoor</tspan><tspan x="138" dy="17.7">rijden toegelaten</tspan></text>
<rect x="282" y="306" width="236" height="218" rx="14" fill="#fff" stroke="#c9d1de" stroke-width="2"/>
