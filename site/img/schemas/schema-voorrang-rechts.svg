<title id="t">Voorrang van rechts: kruispunt zonder borden of lichten</title>
<desc id="d">Kruispunt zonder borden of lichten: voorrang van rechts. Auto 2 heeft niemand rechts van zich en rijdt eerst. Auto 1 moet auto 2 laten voorgaan (die komt van rechts) en rijdt als tweede. Auto 3 moet auto 1 laten voorgaan (die komt van zijn rechterkant, van onder) en rijdt als laatste.</desc>
