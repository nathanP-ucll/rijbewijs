<title id="t">Wie is een bevoegde persoon?</title>
<desc id="d">Vier kaartjes met een persoon in uniform: de federale en lokale politie, personeel van de wegbeheerders dat toezicht houdt op de weg, douanepersoneel tijdens hun dienst, en personeel dat bruggen op de openbare weg bewaakt of bedient. Soms ook anderen, zoals de brandweer bij een interventie.</desc>

