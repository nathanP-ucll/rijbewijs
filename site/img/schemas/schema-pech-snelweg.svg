<text x="42" y="118.08" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="42" dy="0">1</tspan></text>
<text x="68" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" ><tspan x="68" dy="0">Alarmlichten en</tspan><tspan x="68" dy="18.88">fluohesje aan</tspan></text>
<circle cx="42" cy="212" r="16" fill="#1c2230" stroke="#fff" stroke-width="2"/>
<text x="42" y="218.08" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="42" dy="0">2</tspan></text>
<text x="68" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" ><tspan x="68" dy="0">Zo ver mogelijk naar</tspan><tspan x="68" dy="18.88">rechts, bij voorkeur</tspan><tspan x="68" dy="18.88">op de pechstrook</tspan></text>
<circle cx="42" cy="312" r="16" fill="#1c2230" stroke="#fff" stroke-width="2"/>
<text x="42" y="318.08" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="42" dy="0">3</tspan></text>
<text x="68" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="start" ><tspan x="68" dy="0">Uitstappen aan de</tspan><tspan x="68" dy="18.88">kant van de</tspan><tspan x="68" dy="18.88">vangrail, ver van de</tspan><tspan x="68" dy="18.88">rijbaan</tspan></text>
<circle cx="42" cy="412" r="16" fill="#1c2230" stroke="#fff" stroke-width="2"/>
<text x="42" y="418.08" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20.8" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="42" dy="0">4</tspan></text>
