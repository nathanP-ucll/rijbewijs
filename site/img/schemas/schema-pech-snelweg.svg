<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Pech op de autosnelweg: vijf stappen</title>
<desc id="d">Bovenaanzicht van een autosnelweg met pechstrook en vangrail. Een auto staat op de pechstrook met alarmlichten aan. Een gevarendriehoek staat minstens 100 meter achter de auto. De bestuurder is uitgestapt aan de kant van de vangrail met een fluohesje en staat ver van de rijbaan. Links staat de lijst met de vijf stappen, de laatste is 112 bellen.</desc>
