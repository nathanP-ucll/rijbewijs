<title id="t">De drie gewesten van België</title>
<desc id="d">Een vereenvoudigd kaartje van België met drie gekleurde delen: Vlaanderen in het noorden (geel), Wallonië in het zuiden (rood) en het Brussels Hoofdstedelijk Gewest als klein deel in het midden (blauw). Op elk deel staat de naam.</desc>

