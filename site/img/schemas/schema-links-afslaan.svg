<title id="t">Zo sla je links af</title>
<desc id="d">Een kruispunt. Een rode auto uit de onderste weg slaat links af met de linker richtingaanwijzer aan en neemt een ruime bocht. Op de linkertak steekt een voetganger over: voetgangers gaan ook voor.</desc>
