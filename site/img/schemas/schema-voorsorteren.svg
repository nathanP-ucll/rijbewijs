<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Voorsorteren: kies je rijstrook ruim voor het kruispunt</title>
<desc id="d">Een eenrichtingsweg met drie rijstroken die naar een kruispunt loopt. Op elke strook staat een pijl op het wegdek: links, rechtdoor en rechts. Een rode auto in de linkerstrook gaat links af met linker richtingaanwijzer, een blauwe auto in het midden rijdt rechtdoor en een gele auto in de rechterstrook gaat rechts af met rechter richtingaanwijzer.</desc>
