<rect x="575.56" y="431" width="198.88" height="90.24" rx="9" fill="#fff"  opacity="0.95"/>
<text x="675" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="675" dy="0">Volg de pijlen op</tspan><tspan x="675" dy="20.06">het wegdek en de</tspan><tspan x="675" dy="20.06">borden boven of</tspan><tspan x="675" dy="20.06">langs de rijstroken</tspan></text>
