<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Rangorde: bevoegde persoon, lichten, borden en regels</title>
<desc id="d">Een trap met drie treden: 1 bevelen van een bevoegde persoon, 2 verkeerstekens (lichten, borden, wegmarkeringen), 3 verkeersregels zoals voorrang van rechts. Een agent die je laat stoppen bij groen licht gaat voor: je stopt.</desc>
