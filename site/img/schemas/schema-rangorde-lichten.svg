<text x="74" y="147.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#1c2230" text-anchor="middle" ><tspan x="74" dy="0">1</tspan></text>
<text x="120" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="120" dy="0">Bevoegde persoon</tspan></text>
<text x="120" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" ><tspan x="120" dy="0">ook als het licht groen is: je volgt de agent</tspan></text>
