<text x="260" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" ><tspan x="260" dy="0">bv. voorrang van rechts</tspan></text>
<rect x="652" y="391" width="76" height="18" fill="#2b2f36" rx="4"/>
