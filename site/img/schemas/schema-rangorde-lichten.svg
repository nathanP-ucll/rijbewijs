<text x="726" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" ><tspan x="726" dy="0">van rechts</tspan></text>
<text x="400" y="588" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Hoger op de trap = gaat voor. Je volgt de eerste die van toepassing is.</tspan></text>
