<text x="605" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="605" dy="0">Dan verleen jij voorrang.</tspan></text>
