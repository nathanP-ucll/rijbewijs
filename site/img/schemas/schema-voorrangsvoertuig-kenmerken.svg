<title id="t">Zo herken je een voorrangsvoertuig</title>
<desc id="d">Een ziekenwagen van boven gezien met blauwe knipperlichten en geluidsgolven van de sirene. Een voorrangsvoertuig op dringende opdracht heeft blauwe knipperlichten en een sirene; jij verleent voorrang.</desc>

