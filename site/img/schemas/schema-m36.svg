<title id="t">M36: oefenen met begeleider</title>
<desc id="d">Vier kaarten: een M36 is 36 maanden geldig en kan vanaf 17 jaar; je oefent met 1 of 2 begeleiders; het voertuig heeft een extra achteruitkijkspiegel voor de begeleider; andere passagiers zijn niet toegestaan. Rijlessen bij een rijschool zijn niet verplicht.</desc>

