<title id="t">Dashboardlampje bandenspanning</title>
<desc id="d">Een doorsnede van een band met een uitroepteken op een donker dashboardvlak: de bandenspanning is te laag. De kleur verschilt per bron, daarom neutraal getekend.</desc>

