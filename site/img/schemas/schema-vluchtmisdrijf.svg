<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" width="800" height="338" role="img" aria-labelledby="t d">
<title id="t">Vluchtmisdrijf: nooit doorrijden</title>
<desc id="d">Twee kolommen. Links, rood: niet doen, doorrijden na een ongeval; dat is strafbaar en kan gevangenisstraf, geldboete en rijverbod geven. Rechts, groen: wel doen, ter plaatse blijven, naam en identiteit geven en hulp verlenen of halen.</desc>

