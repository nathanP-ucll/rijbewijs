<circle cx="64" cy="180" r="13" fill="#d63a3a"/><path d="M58.8 174.8 L69.2 185.2 M69.2 174.8 L58.8 185.2" fill="none" stroke="#fff" stroke-width="3.6400000000000006" stroke-linecap="round"/>
