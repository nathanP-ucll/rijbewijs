<text x="470" y="185.78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1c2230" text-anchor="start"><tspan x="470" dy="0">Geef je naam en identiteit</tspan></text>
