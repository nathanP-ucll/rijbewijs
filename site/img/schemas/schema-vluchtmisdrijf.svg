<text x="400" y="303.58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Niet ter plaatse blijven is een zware fout.</tspan></text>
