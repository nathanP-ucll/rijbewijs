<title id="t">Bevoegde persoon: arm rechtop betekent stoppen voor iedereen</title>
<desc id="d">Links een bevoegde persoon (agent) met één arm rechtop. Rechts een kruispunt van boven gezien met in het midden de agent en op elk van de vier takken een auto met een rode stopstreep: alle weggebruikers uit alle richtingen moeten stoppen, wie al op het kruispunt staat maakt het vrij.</desc>

