<g transform="translate(285 110) rotate(0)"><rect x="-16" y="-30" width="32" height="60" rx="9" fill="#d64545" stroke="#1c2230" stroke-width="2.5"/><rect x="-11" y="-20" width="22" height="9" rx="3" fill="#cfe6f7" stroke="#1c2230" stroke-width="1.5"/><rect x="-11" y="17" width="22" height="7" rx="3" fill="#b9d3e6" stroke="#1c2230" stroke-width="1.5"/><rect x="-13" y="-31" width="7" height="4" rx="2" fill="#fff3a8"/><rect x="6" y="-31" width="7" height="4" rx="2" fill="#fff3a8"/><circle cx="-15" cy="-27" r="5" fill="#ff9d00" stroke="#fff" stroke-width="1.5"/><circle cx="-15" cy="27" r="5" fill="#ff9d00" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="-27" r="5" fill="#ff9d00" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="27" r="5" fill="#ff9d00" stroke="#fff" stroke-width="1.5"/></g>
<polygon points="285,233 309.3,276.2 260.7,276.2" fill="#fff" stroke="#d63a3a" stroke-width="9" stroke-linejoin="round"/>
<polygon points="285,250.55 295.8,269.45 274.2,269.45" fill="#d63a3a" opacity=".55"/>
<g stroke="#fff" stroke-width="3"><line x1="325" y1="140" x2="325" y2="260" stroke-dasharray="8 6"/><line x1="317" y1="140" x2="333" y2="140"/><line x1="317" y1="260" x2="333" y2="260"/></g>
