<text x="400" y="596" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">verkeer komt van onder</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Gevarendriehoek: hoe ver achter je voertuig?</tspan></text>
