<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Gevarendriehoek: 30 m op een gewone weg, 100 m op de autosnelweg</title>
<desc id="d">Twee wegen naast elkaar, op dezelfde schaal. Links een gewone weg met een stilstaande auto met alarmlichten en een gevarendriehoek op 30 meter achter de auto (in de richting vanwaar het verkeer komt). Rechts een autosnelweg met een auto op de pechstrook en de gevarendriehoek op minstens 100 meter achter de auto. Naderend verkeer komt van onder.</desc>
