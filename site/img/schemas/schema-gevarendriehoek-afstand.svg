<rect x="65" y="62" width="270" height="31.24" rx="9" fill="#fff"  opacity="0.95"/>
<text x="200" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="200" dy="0">Gewone weg: minstens 30 m</tspan></text>
</g>
<g transform="translate(400 0)">
