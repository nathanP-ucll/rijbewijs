<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Weg met middenberm: past je auto op de berm?</title>
<desc id="d">Twee bovenaanzichten van een weg met twee gescheiden rijbanen en een middenberm waarop een auto die de weg wil oversteken tussen de rijbanen wacht. Links: de middenberm is smal en de auto steekt er met zijn achterkant naar buiten in de rijbaan, de auto hindert het verkeer en dit mag niet. Rechts: de middenberm is breed genoeg en de auto staat er volledig op, zonder het verkeer te hinderen.</desc>
