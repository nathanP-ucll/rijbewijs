<title id="t">Het praktijkexamen</title>
<desc id="d">Drie kaarten: voorwaarden (vanaf 18 jaar, geldig theorie-examen en voorlopig rijbewijs; kostprijs 51 euro), onderdeel 1 een gevaarherkenningstest op de computer en onderdeel 2 de proef op de openbare weg. Onderaan: twee keer na elkaar gezakt betekent minstens 6 uur rijles bij een erkende rijschool voor je opnieuw mag.</desc>

