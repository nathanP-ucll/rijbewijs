<text x="142" y="185.38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="142" dy="0">Vanaf 18 jaar, met een</tspan><tspan x="142" dy="18.91">geldig theorie-examen en</tspan><tspan x="142" dy="18.91">voorlopig rijbewijs.</tspan><tspan x="142" dy="18.91">Kostprijs: 51 euro.</tspan></text>
