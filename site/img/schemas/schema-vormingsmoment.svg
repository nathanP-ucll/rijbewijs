<title id="t">Het vormingsmoment voor begeleiders</title>
<desc id="d">Vier kaarten: het vormingsmoment duurt 3 uur en is geen verkeersexamen; een erkende rijschool of lesgever geeft het ter plaatse of live online; het attest is 10 jaar geldig; je volgt het minstens 5 maanden voor het praktijkexamen. Een attest uit Wallonië wordt niet aanvaard.</desc>

