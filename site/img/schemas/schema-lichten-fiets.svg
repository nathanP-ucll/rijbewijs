<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Fietslichten</title>
<desc id="d">Vier voorbeelden: (1) een fietslicht met een fietssilhouet in rood, oranje en groen: geldt alleen voor fietsers en tweewielige bromfietsen; (2) een fietslicht met pijltjes rond het fietsje: dezelfde kleur geldt tegelijk voor de dwarsrichting; (3) een combinatielicht fiets en voetganger; (4) een knipperend oranje fietslicht met een knipperende oranje pijl, samen met rood: alleen in de richting van de pijl verder, met voorrang voor anderen.</desc>

