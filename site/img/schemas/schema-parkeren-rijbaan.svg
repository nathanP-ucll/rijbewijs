<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Parkeren op de rijbaan: rechts, in één rij</title>
<desc id="d">Een tweerichtingsstraat. Een auto staat geparkeerd aan de rechterkant van de rijbaan, zo ver mogelijk van de middenlijn en evenwijdig met de rand. Een tweede auto die ernaast dubbel geparkeerd staat is fout.</desc>

