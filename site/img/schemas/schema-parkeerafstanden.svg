<title id="t">Afstanden bij stilstaan en parkeren</title>
<desc id="d">Vier kleine schema's van een straat met rode gearceerde zones. Linksboven: 5 meter voor een zebrapad (stilstaan en parkeren verboden). Rechtsboven: 20 meter voor verkeerslichten (stilstaan en parkeren verboden). Linksonder: 15 meter aan weerszijden van het bord van een bus- of tramhalte (parkeren verboden). Rechtsonder: minder dan 1 meter vóór of achter een ander geparkeerd voertuig (parkeren verboden).</desc>
