<title id="t">Markering voor een kruispunt</title>
<desc id="d">Bovenaanzicht van een smalle weg die van onder op een brede dwarsweg uitkomt. Een blauwe auto rijdt in de rechterrijstrook naar het kruispunt. Vlak voor het kruispunt staat in die rijstrook een rij witte driehoeken met de punt naar de auto. Op de dwarsweg rijdt een rode auto van links naar rechts.</desc>

