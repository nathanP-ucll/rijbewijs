<title id="t">Bij een halte: niet parkeren en niet oversteken over tramsporen</title>
<desc id="d">Bovenaan een weg met een halte langs het trottoir. Aan weerszijden van het haltebord is een rode zone getekend van minder dan 15 meter waar parkeren verboden is; een auto in die zone staat fout, een auto ver erbuiten staat goed. Onderaan wacht een voetganger aan de rand van tramsporen omdat er een tram nadert.</desc>
