<title id="t">Rechts rijden op een tweerichtingsweg</title>
<desc id="d">Een weg met twee rijrichtingen van onder naar boven gezien. De auto die naar boven rijdt, rijdt rechts van de middenlijn; de tegenligger die naar beneden rijdt, rijdt aan de andere kant van de middenlijn, dus ook rechts voor zijn eigen rijrichting.</desc>
