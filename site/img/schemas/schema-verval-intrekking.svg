<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 337" width="800" height="337" role="img" aria-labelledby="t d">
<title id="t">Verval of intrekking: het verschil</title>
<desc id="d">Twee paneel naast elkaar. Verval: beslist door de rechter, minstens 8 dagen tot levenslang, een straf of maatregel, soms herstel na een examen of onderzoek. Intrekking: beslist door de procureur of soms de gerechtelijke politie, 15 dagen tenzij verlengd tot maximaal 3 maanden, een tijdelijke maatregel, je krijgt je rijbewijs terug.</desc>

