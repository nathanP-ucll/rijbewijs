<title id="t">Zonder of met middenberm: twee rijstroken per richting</title>
<desc id="d">Twee bovenaanzichten naast elkaar van een weg buiten de bebouwde kom met twee rijstroken per richting. Links zonder middenberm: de rijrichtingen zijn alleen gescheiden door een witte lijn en de snelheid is de gewone limiet van het gewest. Rechts met middenberm: de rijrichtingen zijn gescheiden door een fysieke middenberm en de snelheid is 120 km/u in elk gewest.</desc>
