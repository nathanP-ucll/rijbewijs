<title id="t">Alarmnummers: 112, 100 en 101</title>
<desc id="d">Drie kaarten met een groot nummer: 112 (ambulance en brandweer, gratis), 100 (komt bij dezelfde noodcentrale uit als 112) en 101 (dringende politiehulp, gratis). Daaronder hoe je belt: vast toestel, gsm, 112-app of praatpaal. Het nummer 1722 is geen noodnummer.</desc>

