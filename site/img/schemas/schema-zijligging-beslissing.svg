<text x="535" y="178.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="535" dy="0">Kijken, luisteren en voelen,</tspan><tspan x="535" dy="19.52">maximaal 10 seconden.</tspan></text>
