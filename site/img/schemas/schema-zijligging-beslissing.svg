<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533" role="img" aria-labelledby="t d">
<title id="t">Wanneer stabiele zijligging?</title>
<desc id="d">Beslissingsschema. Het slachtoffer reageert niet, daarna de vraag: ademt het normaal? Bij ja: stabiele zijligging, de luchtweg blijft open, laat 112 alarmeren en controleer elke minuut de ademhaling. Bij nee: reanimeren met 112 en een AED. Niet in zijligging bij vermoeden van wervelletsel.</desc>

