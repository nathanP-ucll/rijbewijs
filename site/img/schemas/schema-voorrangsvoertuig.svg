<title id="t">Voorrangsvoertuig: doorgang vrijmaken</title>
<desc id="d">Zodra de sirene van een prioritair voertuig te horen is, maakt elke weggebruiker onmiddellijk de doorgang vrij en verleent voorrang, zo nodig door te stoppen. Dat geldt ook als je zelf voorrang zou hebben.</desc>
