<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Ritsen, oprit en file: drie situaties</title>
<desc id="d">Drie kleine scènes. Links: een rijstrook eindigt en het verkeer is sterk vertraagd, dus de auto's ritsen en voegen beurtelings in. Midden: een auto op een oprit verleent voorrang aan het verkeer op de autosnelweg (bord voorrang verlenen). Rechts: bij file op twee rijstroken vormen de auto's een reddingsstrook waar een ziekenwagen doorrijdt.</desc>
