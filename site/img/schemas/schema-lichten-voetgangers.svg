<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Voetgangerslichten</title>
<desc id="d">Een tweekleurig voetgangerslicht: rood met een stilstaand mannetje bovenaan en groen met een stappend mannetje onderaan. Drie toestanden: rood (niet de rijbaan op), groen (je mag oversteken) en knipperend groen (de toelating eindigt binnenkort). Een variant met pijltjes rond het mannetje geldt ook voor de dwarsrichting.</desc>

