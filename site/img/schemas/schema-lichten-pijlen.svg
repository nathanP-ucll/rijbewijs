<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Pijllichten en groene pijl naast rood</title>
<desc id="d">Drie voorbeelden: (1) een rood licht met een groene pijl naar links eronder: je mag enkel naar links, met voorrang voor wie regelmatig uit andere richtingen komt en voor voetgangers; (2) een rode pijl naar links: links afslaan is verboden, rechtdoor volgt het gewone licht; (3) een apart groene pijl naar links bij het uitrijden van een kruispunt: het tegenliggend verkeer staat stil (ontruimingspijl).</desc>

<rect width="800" height="600" fill="#eef1f6"/>
<rect x="134" y="330" width="12" height="40" fill="#6b7280"/>
<rect x="99" y="100" width="82" height="232" rx="16" fill="#1d2128" stroke="#000" stroke-width="3"/>
<circle cx="140" cy="144" r="37" fill="#e5322d" opacity="0.28"/>
