<circle cx="140" cy="144" r="24" fill="#e5322d"/>
<circle cx="140" cy="216" r="30" fill="#0b0d10" stroke="#2c323b" stroke-width="2"/>
<circle cx="140" cy="216" r="24" fill="#4d3410"/>
