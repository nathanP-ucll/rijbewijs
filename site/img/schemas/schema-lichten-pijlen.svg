<rect x="579.6" y="421" width="160.8" height="30.06" rx="9" fill="#ffffff"  opacity="0.95"/>
<text x="660" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="660" dy="0">Ontruimingspijl</tspan></text>
<text x="660" y="485" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1c2230" text-anchor="middle" ><tspan x="660" dy="0">Apart groene pijl links:</tspan><tspan x="660" dy="17.7">tegenliggers staan stil,</tspan><tspan x="660" dy="17.7">links afslaan kan</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
