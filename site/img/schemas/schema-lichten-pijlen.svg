<g transform="translate(140 288) rotate(270)"><path d="M0,-27 L18.9,-1.35 L7.0200000000000005,-1.35 L7.0200000000000005,27 L-7.0200000000000005,27 L-7.0200000000000005,-1.35 L-18.9,-1.35 Z" fill="#1fbf5a"/></g>
<rect x="45.32" y="421" width="189.36" height="30.06" rx="9" fill="#ffffff"  opacity="0.95"/>
<text x="140" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="140" dy="0">Rood + groene pijl</tspan></text>
<text x="140" y="485" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1c2230" text-anchor="middle" ><tspan x="140" dy="0">Enkel in de richting van</tspan><tspan x="140" dy="17.7">de pijl, met voorrang voor</tspan><tspan x="140" dy="17.7">andere richtingen en</tspan><tspan x="140" dy="17.7">voetgangers</tspan></text>
