<rect x="348.16" y="421" width="103.68" height="30.06" rx="9" fill="#ffffff"  opacity="0.95"/>
<text x="400" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Rode pijl</tspan></text>
<text x="400" y="485" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Verboden in de richting</tspan><tspan x="400" dy="17.7">van de pijl (zelfde als</tspan><tspan x="400" dy="17.7">het ronde licht)</tspan></text>
