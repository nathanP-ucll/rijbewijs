<title id="t">Beginnende bestuurders</title>
<desc id="d">Vier stappen: je hebt minder dan 2 jaar rijbewijs B, je wordt veroordeeld voor een overtreding die tot verval kan leiden, de rechter spreekt het verval uit en herstel kan pas na opnieuw slagen voor een theorie- of praktijkexamen. Sinds 1 juli 2026 geldt dit ook voor een voorlopig rijbewijs.</desc>

