<title id="t">Driekleurig verkeerslicht: groen, oranje, rood, groen</title>
<desc id="d">Een verkeerslicht met rood bovenaan, oranje in het midden en groen onderaan. Daarnaast vier stappen van de volgorde: groen, dan oranje, dan rood, dan weer groen. Onderaan de betekenis: rood stoppen voor de stopstreep, oranje stoppen tenzij je niet meer veilig kunt stoppen, groen mag voorbij.</desc>
