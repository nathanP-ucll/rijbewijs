<title id="t">Rechts afslaan: voetgangers en fietsers gaan voor (oefening)</title>
<desc id="d">Bovenaanzicht van een T-kruispunt met een fietspad (rood) langs de hoofdweg. Auto 1 rijdt van links naar rechts en slaat rechts af naar de zijstraat (rechter richtingaanwijzer). Een fietser (3) rijdt rechtdoor op het fietspad rechts van de auto. Een voetganger (2) steekt de zijstraat over.</desc>
