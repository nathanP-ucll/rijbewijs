<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 443" width="800" height="443" role="img" aria-labelledby="t d">
<title id="t">BA, omnium en bestuurdersverzekering</title>
<desc id="d">Links een rode auto die tegen een geparkeerde blauwe auto rijdt. Daaronder drie verzekeringen: de verplichte BA-verzekering vergoedt de schade die jij aan anderen veroorzaakt (de geparkeerde auto), omnium dekt je eigen voertuigschade volgens contract, en een bestuurders- of ongevallenverzekering dekt je eigen letsels.</desc>
