<text x="147.33" y="365.17" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="147.33" dy="0">Betaalt de schade die jij aan</tspan><tspan x="147.33" dy="18.91">anderen veroorzaakt, hier de</tspan><tspan x="147.33" dy="18.91">geparkeerde auto.</tspan></text>
