<title id="t">Rond plein zonder D5 en zonder B1/B5</title>
<desc id="d">Zonder D5 en zonder B1/B5 is het geen rotonde in de zin van de wegcode maar een plein of kruispunt in de vorm van een cirkel: er geldt voorrang van rechts. Controleer bij elke toegang of er een bord staat.</desc>
