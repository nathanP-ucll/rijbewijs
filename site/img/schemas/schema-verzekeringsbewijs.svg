<text x="442" y="255.44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1c2230" text-anchor="start"><tspan x="442" dy="0">Vermeldt landen en periode van dekking</tspan></text>
<rect x="28" y="302" width="744" height="62.26" rx="12" fill="#d63a3a"/>
<text x="400" y="328.68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Alcohol: de BA betaalt de slachtoffers, maar de verzekeraar kan het bedrag nadien op</tspan><tspan x="400" dy="20.13">jou verhalen als dronkenschap de oorzaak was.</tspan></text>
