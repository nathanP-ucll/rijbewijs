<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 383" width="800" height="383" role="img" aria-labelledby="t d">
<title id="t">Het verzekeringsbewijs</title>
<desc id="d">Links een schets van een verzekeringsbewijs (vroeger de groene kaart) met vakken voor landen en periode, zonder ingevulde waarden. Rechts vier punten: verplicht boorddocument, toon het bij een controle, mag ook elektronisch, vermeldt in welke landen en welke periode je gedekt bent. Onderaan het alcoholkader: de BA betaalt de slachtoffers, de verzekeraar kan het bedrag op jou verhalen.</desc>

