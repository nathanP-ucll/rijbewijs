<text x="193" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#e6f5ea" text-anchor="middle"><tspan x="193" dy="0">vroeger: de groene kaart</tspan></text>
