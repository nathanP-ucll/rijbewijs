<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Waar je je snelheid aan aanpast</title>
<desc id="d">Een auto in het midden met vijf kaartjes errond: andere weggebruikers (vooral de kwetsbaarste), weer, zicht en verkeersdichtheid, de plaats en de staat van de weg, de staat en de lading van je voertuig, en een voldoende veiligheidsafstand tot je voorligger.</desc>

<rect width="800" height="600" fill="#eef1f6"/>
<line x1="400" y1="318" x2="400" y2="118" stroke="#9aa3ad" stroke-width="4" />
<line x1="400" y1="318" x2="666" y2="232" stroke="#9aa3ad" stroke-width="4" />
<line x1="400" y1="318" x2="586" y2="482" stroke="#9aa3ad" stroke-width="4" />
<line x1="400" y1="318" x2="214" y2="482" stroke="#9aa3ad" stroke-width="4" />
<line x1="400" y1="318" x2="134" y2="232" stroke="#9aa3ad" stroke-width="4" />
<circle cx="400" cy="318" r="78" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<g transform="translate(400 318) rotate(0)"><rect x="-16" y="-30" width="32" height="60" rx="9" fill="#d64545" stroke="#1c2230" stroke-width="2.5"/><rect x="-11" y="-20" width="22" height="9" rx="3" fill="#cfe6f7" stroke="#1c2230" stroke-width="1.5"/><rect x="-11" y="17" width="22" height="7" rx="3" fill="#b9d3e6" stroke="#1c2230" stroke-width="1.5"/><rect x="-13" y="-31" width="7" height="4" rx="2" fill="#fff3a8"/><rect x="6" y="-31" width="7" height="4" rx="2" fill="#fff3a8"/></g>
<rect x="288" y="82" width="224" height="72" rx="14" fill="#2d57a8" stroke="#1c2230" stroke-width="2.5" />
<text x="400" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Andere weggebruikers,</tspan><tspan x="400" dy="20.06">vooral de kwetsbaarste</tspan></text>
<rect x="554" y="196" width="224" height="72" rx="14" fill="#1f9d55" stroke="#1c2230" stroke-width="2.5" />
<text x="666" y="227" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="666" dy="0">Weer, zicht en</tspan><tspan x="666" dy="20.06">verkeersdichtheid</tspan></text>
<rect x="474" y="446" width="224" height="72" rx="14" fill="#c27d00" stroke="#1c2230" stroke-width="2.5" />
<text x="586" y="477" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="586" dy="0">Plaats en staat</tspan><tspan x="586" dy="20.06">van de weg</tspan></text>
<rect x="102" y="446" width="224" height="72" rx="14" fill="#8e5bd1" stroke="#1c2230" stroke-width="2.5" />
<text x="214" y="477" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="214" dy="0">Staat en lading</tspan><tspan x="214" dy="20.06">van je voertuig</tspan></text>
<rect x="22" y="196" width="224" height="72" rx="14" fill="#d63a3a" stroke="#1c2230" stroke-width="2.5" />
<text x="134" y="227" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="134" dy="0">Voldoende afstand</tspan><tspan x="134" dy="20.06">tot je voorligger</tspan></text>
<text x="400" y="576" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Een goede bestuurder past zijn snelheid steeds aan.</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Pas je snelheid aan</tspan></text>
