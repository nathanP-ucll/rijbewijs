<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 469" width="800" height="469" role="img" aria-labelledby="t d">
<title id="t">Zo tellen de punten</title>
<desc id="d">Een balk van 50 punten. Je start met 50 punten. Een gewone fout of onbeantwoorde vraag kost 1 punt, een zware fout 5 punten. Met 41 tot 50 punten ben je geslaagd, met 40 of minder niet. Onder de balk drie kaarten: gewone fout min 1, zware fout min 5, geslaagd vanaf 41.</desc>

