<title id="t">Inhalen: links, veilig en met richtingaanwijzer</title>
<desc id="d">Een auto (blauw) haalt een tragere auto (rood) links in op een tweerichtingsweg. Vier stappen met nummers: eerst controleren dat de weg vrij is, dan de linker richtingaanwijzer, dan voorbijrijden met voldoende zijdelingse afstand, en tot slot rechts terugkeren met de rechter richtingaanwijzer.</desc>
