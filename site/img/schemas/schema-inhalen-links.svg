<text x="620" y="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="620" dy="0">1. Controleren: weg vrij,</tspan><tspan x="620" dy="18.88">niemand die jou inhaalt</tspan></text>
<rect x="485.56" y="402" width="268.88" height="47.76" rx="9" fill="#fff"  opacity="0.95"/>
<text x="620" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="620" dy="0">2. Linker richtingaanwijzer,</tspan><tspan x="620" dy="18.88">tijdig</tspan></text>
<rect x="521.4" y="282" width="197.2" height="47.76" rx="9" fill="#fff"  opacity="0.95"/>
<text x="620" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="620" dy="0">3. Voorbijrijden met</tspan><tspan x="620" dy="18.88">zijdelingse afstand</tspan></text>
<rect x="481.08" y="132" width="277.84" height="47.76" rx="9" fill="#fff"  opacity="0.95"/>
