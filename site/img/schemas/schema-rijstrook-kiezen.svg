<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Een rijstrook kiezen: drie situaties</title>
<desc id="d">Drie stroken met een weg in zijaanzicht van bovenaf. Eerste: een eenrichtingsrijbaan met drie rijstroken in de bebouwde kom, auto's rijden in alle stroken (vrij te kiezen). Tweede: een weg met vier rijstroken en twee richtingen; je kiest vrij maar enkel in je eigen richting. Derde: een gewone weg buiten de bebouwde kom, de auto rijdt zo dicht mogelijk bij de rechterrand.</desc>
