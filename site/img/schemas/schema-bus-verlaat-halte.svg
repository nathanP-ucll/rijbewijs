<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Bus verlaat zijn halte (binnen de bebouwde kom)</title>
<desc id="d">Binnen de bebouwde kom laat je een bus of trolleybus in dezelfde rijrichting vertrekken uit zijn halte zodra hij zijn richtingaanwijzer links aan zet. Je vertraagt en stopt zo nodig. Buiten de bebouwde kom geldt dit niet.</desc>
