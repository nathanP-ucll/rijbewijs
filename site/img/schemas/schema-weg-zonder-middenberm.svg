<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
<title id="t">Weg zonder middenberm: alleen een witte lijn</title>
<desc id="d">Bovenaanzicht van een weg buiten de bebouwde kom met twee rijstroken per richting. De twee rijrichtingen zijn alleen gescheiden door een witte lijn op het wegdek, er is geen middenberm. Auto's rijden in beide richtingen. Onderaan staat: de snelheid is de gewone limiet van het gewest.</desc>
