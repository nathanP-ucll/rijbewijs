<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Ritsen: invoegen vlak voor de versmalling, om beurten</title>
<desc id="d">Een weg met twee rijstroken waarvan de linker eindigt (afgezet met pylonen). Vier auto's voegen om beurten in: eerst auto 1 op de rechterstrook, dan auto 2 van de linkerstrook, dan auto 3 rechts, dan auto 4 links. Wie op de doorlopende strook rijdt, laat beurtelings één invoegen. Er wordt pas vlak voor de versmalling ingevoegd.</desc>
