<rect x="200" y="70" width="400" height="530" fill="#4a4f57" />
<line x1="333" y1="70" x2="333" y2="600" stroke="#fff" stroke-width="3" stroke-dasharray="16 14"/>
<line x1="466" y1="70" x2="466" y2="600" stroke="#fff" stroke-width="3" stroke-dasharray="16 14"/>
<rect x="180" y="78" width="440" height="12" fill="#6b7280" />
<rect x="230" y="94" width="72" height="72" rx="10" fill="#1d2128" stroke="#000" stroke-width="3"/><circle cx="266" cy="130" r="30" fill="#0b0d10"/>
