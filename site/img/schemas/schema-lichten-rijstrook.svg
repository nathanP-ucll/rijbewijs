<text x="400" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Groene pijl:</tspan><tspan x="400" dy="16.52">toegelaten</tspan></text>
<rect x="497" y="94" width="72" height="72" rx="10" fill="#1d2128" stroke="#000" stroke-width="3"/><circle cx="533" cy="130" r="30" fill="#0b0d10"/>
