<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Lichten boven de rijstroken</title>
<desc id="d">Een rijbaan met drie rijstroken van onder naar boven gezien, met boven elke rijstrook een signaal: boven de linkse strook een rood kruis (verboden), boven de middelste een groene pijl naar onder (toegelaten) en boven de rechtse een oranje schuine pijl (verlaat deze rijstrook naar de aangeduide strook).</desc>

