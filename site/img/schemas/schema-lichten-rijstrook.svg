<text x="533" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="533" dy="0">Oranje pijl:</tspan><tspan x="533" dy="16.52">verlaat de strook</tspan><tspan x="533" dy="16.52">naar de pijl</tspan></text>
