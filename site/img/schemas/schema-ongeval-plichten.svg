<title id="t">Je plichten na een ongeval</title>
<desc id="d">Twee kolommen. Enkel stoffelijke schade: zorg voor de veiligheid van het verkeer, toon je identiteitskaart, blijf ter plaatse. Lichamelijk letsel: dezelfde plichten, verleen of haal hulp, verplaats het voertuig niet. Onderaan: even weggaan om hulp te halen mag als je eerst naam en adres geeft.</desc>

