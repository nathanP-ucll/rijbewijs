<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Word je ingehaald? Naar rechts en niet versnellen</title>
<desc id="d">Bovenaanzicht van een weg met twee rijrichtingen. De blauwe auto rijdt op de rechterhelft zo ver mogelijk naar rechts terwijl de rode auto met linker richtingaanwijzer hem links inhaalt. De blauwe auto versnelt niet.</desc>
