<title id="t">Opstelvak voor fietsers bij verkeerslichten</title>
<desc id="d">Een rijbaan van onder naar boven met twee stopstrepen achter elkaar en daartussen een wit fietssymbool: het opstelvak. Een fietser staat in het vak, een auto staat achter de eerste stopstreep. Het verkeerslicht staat op rood.</desc>
