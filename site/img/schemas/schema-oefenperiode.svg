<text x="652.67" y="293.38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="652.67" dy="0">Met je begeleider(s) of een</tspan><tspan x="652.67" dy="18.91">erkende rij-instructeur.</tspan></text>
