<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" aria-labelledby="t d">
<title id="t">De oefenperiode</title>
<desc id="d">Een tijdlijn van minstens 5 maanden oefenen op de openbare weg tot het praktijkexamen, in vijf maandvakken. Daaronder drie kaarten: M12-houders zijn vrijgesteld, je theorie-examen moet bij het praktijkexamen nog geldig zijn, en je oefent alleen met je begeleider(s) of een erkende rij-instructeur.</desc>

