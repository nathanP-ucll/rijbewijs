<text x="400" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Altijd in deze volgorde: eerst personen en lichten, dan borden, dan voorrang van rechts.</tspan></text>
