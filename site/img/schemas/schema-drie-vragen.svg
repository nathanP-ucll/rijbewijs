<text x="96" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2230" text-anchor="start" ><tspan x="96" dy="0">Is er een bevoegde persoon</tspan><tspan x="96" dy="24.78">of een werkend verkeerslicht?</tspan></text>
