<title id="t">Bij elk kruispunt dezelfde drie vragen</title>
<desc id="d">Drie vragen onder elkaar met het antwoord ernaast. 1: is er een bevoegde persoon of een werkend verkeerslicht? Dan volg je die. 2: staan er borden? Dan volg je de borden. 3: is er niets van dat alles? Dan geldt voorrang van rechts.</desc>
