<text x="658" y="168.05" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="658" dy="0">Niet geslaagd?</tspan></text>
<text x="658" y="190.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="658" dy="0">Dan raadpleeg je een</tspan><tspan x="658" dy="19.52">oogarts.</tspan></text>
<circle cx="564" cy="84" r="15" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
<text x="564" y="89.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17.25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="564" dy="0">3</tspan></text>
<rect x="28" y="268.32" width="744" height="63.48" rx="12" fill="#1c2230"/>
<text x="400" y="295.47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Op het aanvraagdocument verklaar je zelf dat je medisch in staat bent om veilig te</tspan><tspan x="400" dy="20.74">rijden.</tspan></text>
