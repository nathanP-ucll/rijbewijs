<rect x="286" y="64" width="228" height="188.32" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
<g transform="translate(368 78) scale(0.64)"><path d="M6 50 Q50 8 94 50 Q50 92 6 50 Z" fill="#fff" stroke="#1c2230" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="50" cy="50" r="17" fill="#2f6fd6" stroke="#1c2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="50" cy="50" r="7" fill="#1c2230"/></g>
<text x="400" y="168.05" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="400" dy="0">Oogtest</tspan></text>
<text x="400" y="190.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="400" dy="0">Direct na het geslaagde</tspan><tspan x="400" dy="19.52">examen, in het</tspan><tspan x="400" dy="19.52">examencentrum.</tspan></text>
<circle cx="306" cy="84" r="15" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
<text x="306" y="89.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17.25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="306" dy="0">2</tspan></text>
<path d="M524 147.16 L535 158.16 L524 169.16" fill="none" stroke="#8a8f98" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
