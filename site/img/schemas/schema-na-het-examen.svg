<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t d">
<title id="t">Oogtest en je foute antwoorden</title>
<desc id="d">Drie stappen na het theorie-examen: direct na het examen kun je je foute antwoorden bekijken (later niet meer), na het geslaagde examen volgt een oogtest in het examencentrum, en slaag je daar niet voor dan raadpleeg je een oogarts. Onderaan: op het aanvraagdocument verklaar je zelf dat je medisch in staat bent om veilig te rijden.</desc>

<rect width="800" height="350" fill="#fffdf7"/>
<rect x="30" y="68" width="228" height="188.32" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="28" y="64" width="228" height="188.32" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
<g transform="translate(110 78) scale(0.64)"><path d="M20 8 H62 L82 28 V92 H20 Z" fill="#fff" stroke="#1c2230" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M62 8 V28 H82" fill="none" stroke="#1c2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 44 H70 M30 56 H70 M30 68 H70 M30 80 H54" stroke="#1c2230" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g>
<text x="142" y="168.05" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="142" dy="0">Foute antwoorden</tspan></text>
<text x="142" y="190.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="142" dy="0">Je bekijkt ze meteen na</tspan><tspan x="142" dy="19.52">het examen. Later kan dat</tspan><tspan x="142" dy="19.52">niet meer.</tspan></text>
<circle cx="48" cy="84" r="15" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
<text x="48" y="89.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17.25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="48" dy="0">1</tspan></text>
<path d="M266 147.16 L277 158.16 L266 169.16" fill="none" stroke="#8a8f98" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
