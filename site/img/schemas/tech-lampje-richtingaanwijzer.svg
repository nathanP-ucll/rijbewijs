<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-labelledby="t d">
<title id="t">Dashboardlampje richtingaanwijzer (groen)</title>
<desc id="d">Twee groene pijlen naar links en naar rechts op een donker dashboardvlak: de richtingaanwijzer of alarmlichten staan aan. Groen betekent: het systeem werkt.</desc>

<rect width="200" height="220" rx="22" fill="#171b22"/>
<rect x="6" y="6" width="188" height="208" rx="18" fill="none" stroke="#2c323d" stroke-width="2"/>
<circle cx="100" cy="100" r="62" fill="#2fd36b" opacity=".13"/>
<g transform="translate(100 100) scale(2.1) translate(-32 -32)"><g fill="#2fd36b"><path d="M6 32 L26 14 V24 H30 V40 H26 V50 Z"/><path d="M58 32 L38 14 V24 H34 V40 H38 V50 Z" opacity=".95"/></g></g>
<text x="100" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8ecf3" text-anchor="middle" ><tspan x="100" dy="0">Richtingaanwijzer</tspan></text>
<text x="100" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#9aa3b2" text-anchor="middle" ><tspan x="100" dy="0">groen: staat aan</tspan></text>
</svg>
