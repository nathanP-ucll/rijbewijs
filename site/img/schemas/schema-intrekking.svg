<rect x="288" y="68" width="228" height="175.4" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="286" y="64" width="228" height="175.4" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
<g transform="translate(372 78) scale(0.56)"><path d="M50 6 L87 19 V48 C87 70 71 85 50 94 C29 85 13 70 13 48 V19 Z" fill="#2f6fd6" stroke="#1c2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="50,26 55.29,40.72 70.92,41.2 58.56,50.78 62.93,65.8 50,57 37.07,65.8 41.44,50.78 29.08,41.2 44.71,40.72" fill="#fff"/></g>
<text x="400" y="159.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="400" dy="0">Rijbewijs afgeven</tspan></text>
<text x="400" y="180.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="400" dy="0">De politie kan vragen dat je</tspan><tspan x="400" dy="18.3">het meteen afgeeft.</tspan></text>
<circle cx="306" cy="84" r="15" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
<text x="306" y="89.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17.25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="306" dy="0">2</tspan></text>
<path d="M524 140.7 L535 151.7 L524 162.7" fill="none" stroke="#8a8f98" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="546" y="68" width="228" height="175.4" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="544" y="64" width="228" height="175.4" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
