<text x="658" y="159.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="658" dy="0">Na 15 dagen terug</tspan></text>
<text x="658" y="180.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="658" dy="0">Tenzij de intrekking verlengd</tspan><tspan x="658" dy="18.3">wordt.</tspan></text>
<circle cx="564" cy="84" r="15" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
<text x="564" y="89.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17.25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="564" dy="0">3</tspan></text>
<rect x="50" y="295.4" width="99" height="42" rx="8" fill="#f08a1c"/><rect x="149" y="295.4" width="594" height="42" rx="8" fill="#cfdcf6" stroke="#2f6fd6" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="139" y="295.4" width="10" height="42" fill="#f08a1c"/>
<text x="99.5" y="323.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="99.5" dy="0">15 dagen</tspan></text>
<text x="446" y="323.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2f6fd6" text-anchor="middle"><tspan x="446" dy="0">verlenging: maximaal 3 maanden</tspan></text>
<text x="99.5" y="283.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#b25f00" text-anchor="middle"><tspan x="99.5" dy="0">intrekking</tspan></text>
<text x="446" y="283.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4d5668" text-anchor="middle"><tspan x="446" dy="0">alleen door de politierechtbank</tspan></text>
<rect x="28" y="355.4" width="744" height="42.74" rx="12" fill="#1c2230"/>
<text x="400" y="382.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Intrekking is een tijdelijke maatregel: je krijgt je rijbewijs terug.</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Onmiddellijke intrekking</tspan></text>
