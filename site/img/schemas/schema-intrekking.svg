<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 417" width="800" height="417" role="img" aria-labelledby="t d">
<title id="t">Onmiddellijke intrekking</title>
<desc id="d">Drie stappen: in de regel beveelt de procureur de intrekking (soms een officier van gerechtelijke politie), de politie vraagt je rijbewijs af, na 15 dagen krijg je het terug tenzij de politierechtbank de intrekking met maximaal 3 maanden verlengt. Onder de stappen een tijdlijn op schaal met 15 dagen en een mogelijke verlenging van maximaal 3 maanden.</desc>

<rect width="800" height="417" fill="#fffdf7"/>
<rect x="30" y="68" width="228" height="175.4" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="28" y="64" width="228" height="175.4" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
<g transform="translate(114 78) scale(0.56)"><polygon points="50,8 94,32 6,32" fill="#c9c9c4" stroke="#1c2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="14" y="36" width="72" height="8" fill="#e6e6e2" stroke="#1c2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g fill="#f4f4f0" stroke="#1c2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="20" y="46" width="10" height="32"/><rect x="40" y="46" width="10" height="32"/><rect x="60" y="46" width="10" height="32"/></g><rect x="8" y="78" width="84" height="10" fill="#c9c9c4" stroke="#1c2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="142" y="159.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="142" dy="0">Procureur</tspan></text>
<text x="142" y="180.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="142" dy="0">Beveelt de intrekking in de</tspan><tspan x="142" dy="18.3">regel. Soms doet een officier</tspan><tspan x="142" dy="18.3">van gerechtelijke politie dat.</tspan></text>
<circle cx="48" cy="84" r="15" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
<text x="48" y="89.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17.25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="48" dy="0">1</tspan></text>
