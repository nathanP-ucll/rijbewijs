<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Manoeuvres: jij geeft voorrang</title>
<desc id="d">Vier kleine bovenaanzichten: van rijstrook veranderen (de rode auto voegt in voor de blauwe), keren (de rode auto draait terwijl een blauwe auto nadert), een parkeerplaats verlaten (de groene auto rijdt weg terwijl een blauwe auto nadert) en uit een oprit komen (de gele auto rijdt de weg op terwijl een blauwe auto nadert). Bij een manoeuvre geef je voorrang aan de andere weggebruikers.</desc>
