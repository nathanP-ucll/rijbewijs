<title id="t">Weg met middenberm: fysieke scheiding</title>
<desc id="d">Bovenaanzicht van een weg buiten de bebouwde kom met twee rijstroken per richting. De twee rijrichtingen zijn gescheiden door een middenberm, een brede groene strook met een stoeprand en struiken. Auto's rijden in beide richtingen. Onderaan staat: de snelheid is 120 km/u in elk gewest.</desc>
