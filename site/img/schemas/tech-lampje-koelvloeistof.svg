<title id="t">Dashboardlampje koelvloeistof en temperatuur</title>
<desc id="d">Een thermometer in golvende vloeistof op een donker dashboardvlak: motor te warm of koelvloeistof op. De kleur verschilt per merk, daarom neutraal getekend.</desc>

<rect width="200" height="220" rx="22" fill="#171b22"/>
<rect x="6" y="6" width="188" height="208" rx="18" fill="none" stroke="#2c323d" stroke-width="2"/>
<g transform="translate(100 100) scale(2.1) translate(-32 -32)"><g fill="none" stroke="#d4dae4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 10 V34 a8 8 0 1 0 8 0 V10 Z" transform="translate(-4 0)"/><path d="M42 40 q4 -3 8 0 t8 0 M42 50 q4 -3 8 0 t8 0" transform="translate(-6 -6)"/></g></g>
<text x="100" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8ecf3" text-anchor="middle" ><tspan x="100" dy="0">Koelvloeistof</tspan></text>
<text x="100" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#9aa3b2" text-anchor="middle" ><tspan x="100" dy="0">kleur verschilt per merk</tspan></text>
</svg>
