<title id="t">Van theorie naar rijbewijs B</title>
<desc id="d">Zes genummerde stappen in twee rijen: 1 theorie-examen vanaf 17 jaar (3 jaar geldig), 2 voorlopig rijbewijs (M36 vanaf 17 jaar, M18 vanaf 18 jaar), 3 minstens 5 maanden oefenen op de openbare weg, 4 praktijkexamen vanaf 18 jaar, 5 definitief rijbewijs aanvragen, 6 terugkommoment van 4 uur, 6 tot 9 maanden na het definitieve rijbewijs.</desc>

