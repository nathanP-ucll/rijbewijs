<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" width="800" height="344" role="img" aria-labelledby="t d">
<title id="t">Zo verloopt het theorie-examen</title>
<desc id="d">Vier kaarten: 50 meerkeuzevragen die voorgelezen en getoond worden, 15 seconden per vraag nadat de vraag volledig is voorgelezen, identiteitskaart meenemen (een kopie volstaat niet) en de kostprijs van 19 euro. Onderaan: oefenen kan op het officiële platform Mijn rijbewijs B.</desc>

<rect width="800" height="344" fill="#fffdf7"/>
<rect x="30" y="68" width="175.5" height="202.88" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="28" y="64" width="175.5" height="202.88" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
