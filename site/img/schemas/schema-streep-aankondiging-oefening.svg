<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
<title id="t">Streepmarkering op de weg</title>
<desc id="d">Bovenaanzicht van een weg met twee rijrichtingen waarop een auto naar boven rijdt. Onderaan ligt een middenlijn met lange trekken en grote tussenruimten. Daarboven ligt een gemarkeerd stuk met korte trekken dicht bij elkaar. Verder vooruit is de middenlijn onzichtbaar en staat er een vraagteken.</desc>
