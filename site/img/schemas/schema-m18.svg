<title id="t">M18: zonder begeleider</title>
<desc id="d">Vier stappen: eerst minstens 20 uur rijles bij een erkende rijschool, dan een bekwaamheidsattest dat 3 jaar geldig is, dan de M18 aanvragen vanaf 18 jaar (18 maanden geldig), daarna zonder begeleider rijden met maximaal 2 passagiers. De passagiers voldoen aan dezelfde voorwaarden als een begeleider.</desc>

