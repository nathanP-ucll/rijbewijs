<line x1="314" y1="208" x2="758" y2="208" stroke="#d9d4c4" stroke-width="1.5"/>
<g transform="translate(317 217.74) scale(0.38)"><path d="M50 8 C26 8 20 30 32 46 C38 54 38 60 38 66 H62 C62 60 62 54 68 46 C80 30 74 8 50 8 Z" fill="#f2c230" stroke="#1c2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="38" y="66" width="24" height="8" rx="2" fill="#8a8f98" stroke="#1c2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="74" width="20" height="8" rx="2" fill="#8a8f98" stroke="#1c2230" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g stroke="#f2c230" stroke-width="4" stroke-linecap="round"><path d="M10 28 L18 32 M90 28 L82 32 M50 -2 V0"/></g></g>
<text x="362" y="232.15" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1c2230" text-anchor="start"><tspan x="362" dy="0">De verlichting is defect en niet duidelijk zichtbaar</tspan><tspan x="362" dy="20.74">van op ongeveer 100 m</tspan></text>
<rect x="302" y="287.48" width="472" height="74" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="300" y="283.48" width="472" height="74" rx="14" fill="#fff8e6" stroke="#f08a1c" stroke-width="2.5"/>
<text x="536" y="315.48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c2230" text-anchor="middle"><tspan x="536" dy="0">Zet hem ongeveer rechtop, zodat bestuurders hem van</tspan><tspan x="536" dy="19.52">ongeveer 50 meter zien.</tspan></text>
