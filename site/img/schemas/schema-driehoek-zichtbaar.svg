<line x1="314" y1="168" x2="758" y2="168" stroke="#d9d4c4" stroke-width="1.5"/>
<g transform="translate(317 169) scale(0.38)"><path d="M50 94 C30 64 22 54 22 38 A28 28 0 0 1 78 38 C78 54 70 64 50 94 Z" fill="#d63a3a" stroke="#1c2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="50" cy="38" r="11" fill="#fff"/></g>
