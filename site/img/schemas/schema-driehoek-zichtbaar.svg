<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
<title id="t">De gevarendriehoek: wanneer en waar?</title>
<desc id="d">Bovenaanzicht: een stilstaande auto met alarmlichten, daarachter een gevarendriehoek tussen de auto en het naderende verkeer. Een blauwe auto nadert van onderen; een stippellijn toont dat de driehoek van ongeveer 50 meter zichtbaar moet zijn. Rechts drie situaties waarin je de driehoek plaatst.</desc>

