<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">De limiet is een maximum, geen streefsnelheid</title>
<desc id="d">Een balk die de toegelaten snelheid voorstelt tot het maximum van 70 km/u. Het eerste deel, een aangepaste snelheid, is groen. Het laatste deel is rood: dat mag volgens het bord, maar is te snel bij mist of op een gladde weg. Onder de balk een auto op een mistige weg.</desc>

<rect width="800" height="600" fill="#eef1f6"/>
<rect x="30" y="74" width="740" height="230" rx="14" fill="#fff" stroke="#1c2230" stroke-width="2.5" />
<rect x="60" y="176" width="450" height="54" fill="#2ea36b" rx="10" stroke="#1c2230" stroke-width="2.5"/>
<rect x="510" y="176" width="200" height="54" fill="#f3b3ab" rx="10" stroke="#1c2230" stroke-width="2.5"/>
<text x="285" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="285" dy="0">aangepaste snelheid</tspan></text>
<text x="610" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#8a1f14" text-anchor="middle" ><tspan x="610" dy="0">te snel</tspan></text>
<line x1="710" y1="156" x2="710" y2="250" stroke="#1c2230" stroke-width="5" />
<rect x="662" y="89" width="96" height="66" rx="16" fill="#1c2230" stroke="#1c2230" stroke-width="2.5" />
<text x="710" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="710" dy="0">70</tspan></text>
<text x="710" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d6dbe6" text-anchor="middle" ><tspan x="710" dy="0">km/u</tspan></text>
<text x="710" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="710" dy="0">limiet</tspan></text>
<text x="60" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c2230" text-anchor="start" ><tspan x="60" dy="0">langzaam</tspan></text>
<text x="60" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#1c2230" text-anchor="start" ><tspan x="60" dy="0">Mag je 70, maar is het mistig of glad?</tspan></text>
<text x="60" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c2230" text-anchor="start" ><tspan x="60" dy="0">Dan kan 70 te snel zijn.</tspan></text>
