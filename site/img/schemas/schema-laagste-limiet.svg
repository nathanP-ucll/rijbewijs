<text x="400" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">75 km/u</tspan></text>
<text x="400" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Je volgt altijd de laagste limiet, van de weg of van je voertuig.</tspan></text>
