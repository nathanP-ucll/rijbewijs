<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">De laagste limiet wint: weg of voertuig</title>
<desc id="d">Twee kaarten boven elkaar naar een resultaat: de weg (voorbeeld Wallonië, gewone weg buiten de bebouwde kom, 90 km/u) en je voertuig (voorbeeld bus of autocar op een gewone weg, 75 km/u). Samen volgt daaruit dat je maximaal 75 km/u mag, de laagste van de twee.</desc>
<defs><marker id="ah1c2230" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#1c2230"/></marker></defs>
