<text x="205" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1c2230" text-anchor="middle" ><tspan x="205" dy="0">De weg</tspan></text>
<rect x="130" y="128" width="150" height="40" fill="#4a4f57"/><line x1="130" y1="148" x2="280" y2="148" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
