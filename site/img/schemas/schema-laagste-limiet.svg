<text x="205" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d6dbe6" text-anchor="middle" ><tspan x="205" dy="0">km/u</tspan></text>
<text x="205" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="205" dy="0">Wallonië, gewone weg</tspan><tspan x="205" dy="17.7">buiten de bebouwde kom</tspan></text>
<rect x="420" y="74" width="350" height="230" rx="14" fill="#fff" stroke="#1c2230" stroke-width="2.5" />
<text x="595" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1c2230" text-anchor="middle" ><tspan x="595" dy="0">Je voertuig</tspan></text>
