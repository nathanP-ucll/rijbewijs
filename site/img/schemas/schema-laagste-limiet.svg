<text x="595" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d6dbe6" text-anchor="middle" ><tspan x="595" dy="0">km/u</tspan></text>
<text x="595" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="595" dy="0">Bus of autocar</tspan><tspan x="595" dy="17.7">op gewone wegen</tspan></text>
