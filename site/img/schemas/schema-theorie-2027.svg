<text x="400" y="159.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="400" dy="0">Vlaams examencentrum</tspan></text>
<text x="400" y="181.38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="400" dy="0">Je theorie-examen moet daar</tspan><tspan x="400" dy="18.91">gebeuren.</tspan></text>
