<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 382" width="800" height="382" role="img" aria-labelledby="t d">
<title id="t">Wat verandert er in 2027?</title>
<desc id="d">Drie kaarten over de aangekondigde wijziging: vanaf 1 januari 2027 moet je theorie-examen in een Vlaams examencentrum gebeuren, dat geldt als je in Vlaanderen praktijkexamen wilt doen, en er zijn geen overgangsmaatregelen. Onderaan: principieel goedgekeurd, maar nog niet definitief bevestigd.</desc>

