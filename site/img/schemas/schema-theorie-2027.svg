<text x="652.67" y="203.34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="652.67" dy="0">Dat geldt als je in Vlaanderen</tspan><tspan x="652.67" dy="18.91">praktijkexamen wilt doen.</tspan></text>
<rect x="251.17" y="258.64" width="297.66" height="30" rx="15" fill="#4d5668"/>
<text x="400" y="279.24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Er zijn geen overgangsmaatregelen</tspan></text>
<rect x="28" y="301.64" width="744" height="62.26" rx="12" fill="#f08a1c"/>
<text x="400" y="328.32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Principieel goedgekeurd, maar nog niet definitief bevestigd. Controleer de actuele regels</tspan><tspan x="400" dy="20.13">op vlaanderen.be.</tspan></text>
