<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Stilstaan en parkeren: niet op en niet vlak voor een zebrapad</title>
<desc id="d">Een straat met een zebrapad. Op de rijbaan in minder dan 5 meter voor het zebrapad (in de rijrichting) is stilstaan en parkeren verboden: rode gearceerde zones. Een auto die in zo'n zone staat is fout; een auto die verder weg staat (meer dan 5 meter) mag er staan.</desc>
