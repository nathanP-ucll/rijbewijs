<text x="400" y="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">In de rijrichting gezien: geen stilstaan of parkeren</tspan><tspan x="400" dy="20.06">op het zebrapad en minder dan 5 m ervoor.</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
