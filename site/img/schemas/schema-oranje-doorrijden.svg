<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Oranje: in de regel stoppen</title>
<desc id="d">Een rijbaan met een stopstreep en een verkeerslicht dat oranje is. Een blauwe auto is nog ver van de streep en kan veilig stoppen: hij stopt. Een rode auto is vlak bij de streep en kan niet meer veilig stoppen: hij rijdt door. Gas geven om oranje te halen is fout.</desc>
