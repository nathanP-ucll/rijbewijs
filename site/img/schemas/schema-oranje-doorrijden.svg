<text x="160" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="160" dy="0">kan nog veilig</tspan><tspan x="160" dy="21.24">stoppen: stop</tspan></text>
