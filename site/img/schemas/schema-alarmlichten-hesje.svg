<text x="400" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="400" dy="0">Fluohesje</tspan></text>
<text x="400" y="222.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="400" dy="0">Op een autosnelweg of</tspan><tspan x="400" dy="20.74">autoweg aan zodra je</tspan><tspan x="400" dy="20.74">uitstapt.</tspan></text>
<rect x="538" y="70" width="236" height="221.24" rx="14" fill="#1c2230" opacity=".10"/>
<rect x="536" y="66" width="236" height="221.24" rx="14" fill="#fff" stroke="#d9d4c4" stroke-width="2"/>
