<title id="t">Alarmlichten en fluohesje</title>
<desc id="d">Drie kaarten: de achterkant van een auto met alle richtingaanwijzers knipperend (alarmlichten), een fluohesje dat je aantrekt voor je uitstapt, en een gevarendriehoek die door de alarmlichten niet vervangen wordt.</desc>

