<text x="654" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c2230" text-anchor="middle"><tspan x="654" dy="0">Driehoek blijft nodig</tspan></text>
<text x="654" y="222.85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#4d5668" text-anchor="middle"><tspan x="654" dy="0">Alarmlichten vervangen de</tspan><tspan x="654" dy="20.74">gevarendriehoek niet.</tspan></text>
<rect x="28" y="303.24" width="744" height="43.96" rx="12" fill="#f08a1c"/>
<text x="400" y="331.34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="400" dy="0">Houd het hesje binnen handbereik, niet in de koffer.</tspan></text>
