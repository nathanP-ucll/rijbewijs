<title id="t">Dashboardlampje grootlicht (blauw)</title>
<desc id="d">Een blauw koplamp-symbool met vier lichtstralen op een donker dashboardvlak: het grootlicht brandt. Geen waarschuwing; schakel het uit bij tegenliggers.</desc>

