<title id="t">Kruispunt met voorrangsborden (oefening)</title>
<desc id="d">Kruispunt met drie auto's. Auto 1 komt van onder en heeft geen bord. Auto 2 komt van rechts en heeft het bord voorrang verlenen aan zijn kant. Auto 3 komt van links en heeft het stopbord aan zijn kant met een stopstreep. Alle auto's rijden rechtdoor.</desc>
