<title id="t">Gevarendriehoek: nu en vanaf 1 juni 2027</title>
<desc id="d">Twee kolommen. Nu, tot 1 juni 2027: je plaatst de gevarendriehoek als je niet weg kan. Vanaf 1 juni 2027 volgens de nieuwe wegcode: eerst gebruik je alle alarmlichten, kan dat niet dan plaats je nog een driehoek, op autosnelwegen op 100 meter. Onderaan: leer voor het examen de huidige regels.</desc>

