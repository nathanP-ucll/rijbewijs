<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Auto met aanhangwagen: de combinatie telt</title>
<desc id="d">Twee rijen. Boven: een auto met een kleine aanhangwagen waarvan de combinatie samen tot 3,5 ton blijft: de gewone limiet van de weg. Onder: een auto met een grote aanhangwagen waarvan de combinatie samen boven 3,5 ton komt: de lagere limiet van zwaardere voertuigen, 90 km/u op de autosnelweg.</desc>

