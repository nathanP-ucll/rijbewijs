<text x="250" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="250" dy="0">samen gewogen (maximaal toegelaten massa)</tspan></text>
<rect x="430" y="90" width="320" height="160" rx="14" fill="#1f9d55" stroke="#1c2230" stroke-width="2.5" />
<text x="590" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="590" dy="0">Samen tot 3,5 ton</tspan></text>
<text x="590" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff" text-anchor="middle" ><tspan x="590" dy="0">gewone limiet</tspan><tspan x="590" dy="22.42">van de weg</tspan></text>
<rect x="30" y="290" width="740" height="200" rx="14" fill="#fff" stroke="#1c2230" stroke-width="2.5" />
