<rect x="60" y="132" width="340" height="76" fill="#4a4f57" rx="6"/>
<line x1="60" y1="170" x2="400" y2="170" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
<rect x="170" y="152" width="80" height="36" rx="6" fill="#e8e8ec" stroke="#1c2230" stroke-width="2.5"/>
<line x1="250" y1="170" x2="262" y2="170" stroke="#1c2230" stroke-width="4" />
