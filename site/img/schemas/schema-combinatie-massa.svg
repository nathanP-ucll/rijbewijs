<text x="400" y="526" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Wat telt: de maximaal toegelaten massa van de hele combinatie.</tspan></text>
