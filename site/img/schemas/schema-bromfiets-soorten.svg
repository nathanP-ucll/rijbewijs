<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Soorten bromfietsen en elektrische fietsen</title>
<desc id="d">Vier kaartjes: een gewone elektrische fiets (tot 25 km/u, telt als fiets), bromfiets klasse A (maximaal 25 km/u), bromfiets klasse B (maximaal 45 km/u) en een speed pedelec (ondersteuning tot 45 km/u, telt als bromfiets).</desc>

<rect width="800" height="600" fill="#eef1f6"/>
<rect x="24" y="72" width="372" height="212" rx="14" fill="#1f9d55" stroke="#1c2230" stroke-width="2.5" />
<circle cx="84" cy="178" r="40" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<g transform="translate(84 178) scale(1.7)" fill="none" stroke="#1c2230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-11" cy="8" r="7"/><circle cx="11" cy="8" r="7"/><path d="M-11,8 L-3,-4 L6,-4 L11,8 M-3,-4 L0,8 L-11,8 M6,-4 L4,-9 M1,-9 L8,-9"/><circle cx="-3" cy="-13" r="3.2" fill="#1c2230" stroke="none"/></g>
<text x="142" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="142" dy="0">Gewone elektrische</tspan><tspan x="142" dy="25.96">fiets</tspan></text>
<text x="142" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="142" dy="0">tot 25 km/u</tspan></text>
<text x="142" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="start" ><tspan x="142" dy="0">telt als fiets</tspan></text>
<rect x="404" y="72" width="372" height="212" rx="14" fill="#f08a1c" stroke="#1c2230" stroke-width="2.5" />
<circle cx="464" cy="178" r="40" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<g transform="translate(464 178) scale(1.7)" fill="none" stroke="#1c2230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-11" cy="8" r="7"/><circle cx="11" cy="8" r="7"/><path d="M-11,8 L-3,-4 L6,-4 L11,8 M-3,-4 L0,8 L-11,8 M6,-4 L4,-9 M1,-9 L8,-9"/><circle cx="-3" cy="-13" r="3.2" fill="#1c2230" stroke="none"/></g>
<text x="522" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="522" dy="0">Bromfiets</tspan><tspan x="522" dy="25.96">klasse A</tspan></text>
<text x="522" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="522" dy="0">max. 25 km/u</tspan></text>
<text x="522" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="start" ><tspan x="522" dy="0">telt als bromfiets A</tspan></text>
<rect x="24" y="298" width="372" height="212" rx="14" fill="#d63a3a" stroke="#1c2230" stroke-width="2.5" />
<circle cx="84" cy="404" r="40" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<g transform="translate(84 404) scale(1.7)" fill="none" stroke="#1c2230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-11" cy="8" r="7"/><circle cx="11" cy="8" r="7"/><path d="M-11,8 L-3,-4 L6,-4 L11,8 M-3,-4 L0,8 L-11,8 M6,-4 L4,-9 M1,-9 L8,-9"/><circle cx="-3" cy="-13" r="3.2" fill="#1c2230" stroke="none"/></g>
<text x="142" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="142" dy="0">Bromfiets</tspan><tspan x="142" dy="25.96">klasse B</tspan></text>
<text x="142" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="142" dy="0">max. 45 km/u</tspan></text>
<text x="142" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="start" ><tspan x="142" dy="0">telt als bromfiets B</tspan></text>
<rect x="404" y="298" width="372" height="212" rx="14" fill="#8e5bd1" stroke="#1c2230" stroke-width="2.5" />
<circle cx="464" cy="404" r="40" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<g transform="translate(464 404) scale(1.7)" fill="none" stroke="#1c2230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-11" cy="8" r="7"/><circle cx="11" cy="8" r="7"/><path d="M-11,8 L-3,-4 L6,-4 L11,8 M-3,-4 L0,8 L-11,8 M6,-4 L4,-9 M1,-9 L8,-9"/><circle cx="-3" cy="-13" r="3.2" fill="#1c2230" stroke="none"/></g>
<text x="522" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="522" dy="0">Speed</tspan><tspan x="522" dy="25.96">pedelec</tspan></text>
<text x="522" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" ><tspan x="522" dy="0">ondersteuning</tspan><tspan x="522" dy="28.32">tot 45 km/u</tspan></text>
<text x="522" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="start" ><tspan x="522" dy="0">telt als bromfiets</tspan></text>
<text x="400" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Voor een bromfiets geldt een minimumleeftijd van 16 jaar en een helm is verplicht.</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Soorten bromfietsen</tspan></text>
