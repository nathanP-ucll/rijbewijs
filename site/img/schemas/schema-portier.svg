<title id="t">Portier openen: eerst kijken</title>
<desc id="d">Een straat met een geparkeerde auto waarvan het portier aan de rijbaanzijde open gaat. Een fietser rijdt vlak langs de auto en zou tegen het open portier botsen. Een rood kruis en de tekst: kijk in je spiegel en over je schouder voor je het portier opent.</desc>
