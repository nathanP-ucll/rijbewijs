<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Aardeweg komt uit op een verharde weg (oefening)</title>
<desc id="d">T-kruispunt: een bruine aardeweg (zandweg) komt van onder uit op een grijze verharde weg. Auto 1 rijdt op de aardeweg richting de verharde weg en rijdt rechtdoor het kruispunt op. Auto 2 rijdt op de verharde weg en komt van links (vanuit de gezichtshoek van auto 1) en rijdt naar rechts. Er staan geen borden.</desc>
