<title id="t">M12 en wisselen van model</title>
<desc id="d">Twee paneel. Omwisselen: je mag één keer wisselen tussen M36 en M18, zolang je voorlopig rijbewijs en je theorie-examen nog geldig zijn. M12: aan te vragen nadat een eerder voorlopig rijbewijs is verlopen, met 6 uur rijles bij een erkende rijschool, 12 maanden geldig, met begeleider en maar één keer.</desc>

