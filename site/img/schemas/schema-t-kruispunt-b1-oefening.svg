<title id="t">T-kruispunt met bord voorrang verlenen op de zijtak (oefening)</title>
<desc id="d">T-kruispunt. Auto 1 komt uit de zijstraat en slaat links af; bij de zijstraat staat het bord voorrang verlenen met een stopstreep. Auto 2 komt van rechts, auto 3 van links, beide rijden rechtdoor op de doorlopende weg.</desc>
