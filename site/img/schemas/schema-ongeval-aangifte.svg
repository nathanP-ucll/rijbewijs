<title id="t">Aangifte bij de politie</title>
<desc id="d">Boven: drie stappen. Niemand van de politie te bereiken, ga naar het dichtstbijzijnde politiebureau of dat van je woonplaats, meld het zo snel mogelijk. Onder: twee termijnen. Enkel stoffelijke schade: zodra mogelijk. Met gewonden: binnen 24 uur.</desc>

