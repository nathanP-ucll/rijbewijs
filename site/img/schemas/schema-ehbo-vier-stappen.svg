<title id="t">EHBO: de vier stappen</title>
<desc id="d">Vier genummerde stappen van het Rode Kruis: 1 zorg voor veiligheid, 2 beoordeel de toestand van het slachtoffer, 3 alarmeer 112, 4 verleen verdere hulp. Daaronder drie controles: bewustzijn, luchtweg en ademhaling (kijken, luisteren en voelen, maximaal 10 seconden).</desc>

