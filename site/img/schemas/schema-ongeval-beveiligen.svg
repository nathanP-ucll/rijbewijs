<title id="t">Stap 1 en 2: beveilig de plaats</title>
<desc id="d">Bovenaanzicht van een weg met een stilstaande auto met alarmlichten, een gevarendriehoek achter de auto, een persoon met fluohesje op de berm en enkele mensen die achter de vangrail wachten. Een naderende auto komt van onderen. Vier genummerde punten: alarmlichten aan, fluohesje aan, gevarendriehoek plaatsen, wachten achter de vangrail.</desc>
