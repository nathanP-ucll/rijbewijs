<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Het zebrapad en jij als bestuurder</title>
<desc id="d">Drie kleine scènes. Zebrapad zonder agent of licht: matig naderen en voorrang geven. Voetganger is al bezig terwijl jouw licht groen wordt: laat hem uitlopen. Het licht of de agent sluit jouw richting: stop voor het zebrapad. Onderaan: extra attent bij een bus of grote auto voor het zebrapad.</desc>
