<text x="325" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff" text-anchor="middle" ><tspan x="325" dy="0">?</tspan></text>
<rect x="240" y="48" width="320" height="250" fill="url(#fog2)" />
<rect x="262.2" y="153" width="275.6" height="33.6" rx="9" fill="#fff"  opacity="0.95"/>
