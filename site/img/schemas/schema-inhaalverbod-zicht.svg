<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Geen zicht: niet links inhalen</title>
<desc id="d">Een weg die over een heuvelkruin loopt. Een auto rijdt achter een tragere voorligger, maar achter de kruin ziet hij niet of er een tegenligger aankomt (die zit achter de kruin, weergegeven als een vage auto met vraagteken). Daarom mag hij niet inhalen.</desc>
