<g stroke="#d63a3a" stroke-width="9" stroke-linecap="round"><line x1="392" y1="312" x2="428" y2="348"/><line x1="428" y1="312" x2="392" y2="348"/></g>
<rect x="45.8" y="431" width="208.4" height="90.24" rx="9" fill="#fff"  opacity="0.95"/>
<text x="150" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="150" dy="0">Kun je niet ver</tspan><tspan x="150" dy="20.06">genoeg zien dat</tspan><tspan x="150" dy="20.06">de weg vrij is?</tspan><tspan x="150" dy="20.06">Dan haal je niet in.</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Je ziet niet of de weg vrij is: niet inhalen</tspan></text>
</svg>
