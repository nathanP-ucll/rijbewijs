<title id="t">Verval van het recht tot sturen</title>
<desc id="d">Vier stappen: een rechter spreekt het verval uit (een straf, of je bent niet geschikt), het duurt minstens 8 dagen tot levenslang, je levert je rijbewijs in bij de griffier, en de rechter kan het herstel laten afhangen van een theorie-examen, een praktijkexamen of een medisch of psychologisch onderzoek.</desc>

