<text x="658" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="658" dy="0">moet het</tspan><tspan x="658" dy="24.78">fietspad volgen</tspan></text>
<text x="400" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Bromfiets klasse B en speed pedelec: tot en met 50 km/u mag het, erboven moet het.</tspan></text>
<text x="400" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle" ><tspan x="400" dy="0">Is er geen bruikbaar fietspad, dan volg je de rijbaan.</tspan></text>
