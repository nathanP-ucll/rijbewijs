<text x="407" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="407" dy="0">mag het</tspan><tspan x="407" dy="24.78">fietspad volgen</tspan></text>
