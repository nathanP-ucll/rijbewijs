<title id="t">Bromfietsen op het fietspad</title>
<desc id="d">Een tabel met drie rijen en twee kolommen. Weg tot 50 km/u: bromfiets klasse A volgt het fietspad, bromfiets klasse B en speed pedelec mogen het fietspad volgen. Weg boven 50 km/u: bromfiets klasse A volgt het fietspad, bromfiets klasse B en speed pedelec moeten het volgen.</desc>

