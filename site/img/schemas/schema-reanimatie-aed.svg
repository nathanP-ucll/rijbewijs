<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Reanimatie en AED</title>
<desc id="d">Eerst vier stappen: alarmeer 112 en laat een AED halen, 30 borstcompressies in het midden van de borstkas, 2 beademingen, daarna 30 en 2 blijven afwisselen. Daaronder de AED: activeren en de aanwijzingen volgen, 2 elektroden op de ontblote borstkas, tijdens analyse of schok raakt niemand het slachtoffer aan.</desc>

