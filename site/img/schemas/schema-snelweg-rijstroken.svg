<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Autosnelweg: rijstroken en inhalen</title>
<desc id="d">Bovenaanzicht van een autosnelweg met drie rijstroken. Een blauwe personenwagen haalt een gele auto links in en keert daarna terug naar de rechterstrook. In de middelste strook rijdt een vrachtwagen (toegelaten); in de linkerstrook staat een vrachtwagen met een rood kruis: die mag daar niet rijden.</desc>
