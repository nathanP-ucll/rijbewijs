<rect x="402" y="92" width="8" height="132" rx="4" fill="#1f9d55"/>
<text x="424" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1c2230" text-anchor="start" ><tspan x="424" dy="0">Personenwagen</tspan></text>
<text x="424" y="149" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6577" text-anchor="start" ><tspan x="424" dy="0">Rechterrijstrook. Links enkel om</tspan><tspan x="424" dy="18.88">in te halen, daarna terug naar</tspan><tspan x="424" dy="18.88">rechts.</tspan></text>
<rect x="402" y="252" width="8" height="132" rx="4" fill="#f08a1c"/>
<text x="424" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1c2230" text-anchor="start" ><tspan x="424" dy="0">Bus, autocar en voertuigen</tspan><tspan x="424" dy="22.42">boven 3,5 ton</tspan></text>
<text x="424" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6577" text-anchor="start" ><tspan x="424" dy="0">Bij drie of meer rijstroken</tspan><tspan x="424" dy="18.88">enkel de twee rechtse</tspan><tspan x="424" dy="18.88">rijstroken.</tspan></text>
<rect x="402" y="412" width="8" height="132" rx="4" fill="#d63a3a"/>
<text x="424" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1c2230" text-anchor="start" ><tspan x="424" dy="0">Middenstrookrijden</tspan></text>
<text x="424" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6577" text-anchor="start" ><tspan x="424" dy="0">Op de middelste strook blijven</tspan><tspan x="424" dy="18.88">rijden terwijl rechts vrij is,</tspan><tspan x="424" dy="18.88">is een overtreding.</tspan></text>
<rect x="0" y="0" width="800" height="48" fill="#1c2230" opacity="0.9"/>
<text x="400" y="33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" ><tspan x="400" dy="0">Autosnelweg: rechts rijden, links inhalen</tspan></text>
</svg>
