<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" role="img" aria-labelledby="t d">
<title id="t">De begeleider: wie mag het zijn?</title>
<desc id="d">Twee paneel. Links de voorwaarden voor een begeleider: ingeschreven in België met een Belgisch identiteitsdocument, minstens 8 jaar rijbewijs voor dat voertuig, niet vervallen verklaard van het recht tot sturen (ook niet in de laatste 3 jaar) en geen andere leerling begeleid in het afgelopen jaar. Rechts: maximaal 2 begeleiders, registratie bij het gemeentebestuur en de uitzondering voor familie.</desc>

