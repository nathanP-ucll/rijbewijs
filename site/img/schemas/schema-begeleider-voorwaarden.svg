<text x="90" y="239.94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#1c2230" text-anchor="start"><tspan x="90" dy="0">Niet vervallen verklaard van het recht tot</tspan><tspan x="90" dy="20.13">sturen, ook niet in de laatste 3 jaar</tspan></text>
