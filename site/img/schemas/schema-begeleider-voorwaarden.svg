<text x="526" y="256.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#1c2230" text-anchor="start"><tspan x="526" dy="0">Familie telt niet als andere</tspan><tspan x="526" dy="20.13">leerling (kinderen,</tspan><tspan x="526" dy="20.13">kleinkinderen, broers, zussen,</tspan><tspan x="526" dy="20.13">pleegkinderen)</tspan></text>
