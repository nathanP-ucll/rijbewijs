<text x="526" y="199.94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#1c2230" text-anchor="start"><tspan x="526" dy="0">Zij laten zich registreren bij</tspan><tspan x="526" dy="20.13">het gemeentebestuur</tspan></text>
<line x1="478" y1="232.52" x2="758" y2="232.52" stroke="#d9d4c4" stroke-width="1.5"/>
