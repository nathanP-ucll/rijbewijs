<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 371" width="800" height="371" role="img" aria-labelledby="t d">
<title id="t">Geldigheid, vernieuwen en verlies</title>
<desc id="d">Een tijdlijn van 10 jaar (kaartmodel) met de laatste 3 maanden gemarkeerd als moment om te vernieuwen. Daaronder drie kaarten: vernieuwen online via BelDrive of bij je gemeente, gestolen rijbewijs (eerst naar de politie, dan naar je gemeente) en een rijgeschiktheidsattest of verval (geen BelDrive, ga naar het gemeentebestuur).</desc>

