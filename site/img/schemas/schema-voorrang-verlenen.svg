<title id="t">Voorrang verlenen: de ander laat je doorrijden</title>
<desc id="d">Een kruispunt zonder borden of lichten. Een blauwe auto komt van rechts en rijdt door. De rode auto uit de onderste weg verleent voorrang: hij wacht tot de blauwe auto voorbij is.</desc>
