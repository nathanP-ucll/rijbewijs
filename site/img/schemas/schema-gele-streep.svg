<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Gele onderbroken streep op de rand van de rijbaan</title>
<desc id="d">Een straat met een gele onderbroken streep langs de rand van de rijbaan. Een auto die langs die streep geparkeerd staat, staat fout: parkeren op de rijbaan langs die streep is verboden. Een auto die op een stuk zonder gele streep geparkeerd staat, staat goed (indien niets anders het verbiedt).</desc>

