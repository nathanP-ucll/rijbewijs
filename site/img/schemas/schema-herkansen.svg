<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 462" width="800" height="462" role="img" aria-labelledby="t d">
<title id="t">Gezakt? Herkansen en geldigheid</title>
<desc id="d">Een reeks van vijf mislukte pogingen met drie gevolgen. Na 2 keer: 12 uur theorieopleiding en een getuigschrift voor je derde poging. Na 4 keer: je volgt die lessen niet opnieuw. Na 5 keer: je kan ook zonder attest een vertraagd examen vragen. Onderaan: een geslaagd theorie-examen blijft 3 jaar geldig.</desc>

