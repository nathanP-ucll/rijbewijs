<title id="t">Wie mag op de busstrook?</title>
<desc id="d">Links een weg met een gewone rijstrook en een busstrook (afgebakend met een brede onderbroken witte streep) waarop een bus rijdt; een personenauto op de gewone rijstrook blijft ervan af. Rechts een overzicht: bus en tram altijd, taxi, fiets, bromfiets en motorfiets enkel als het bord of onderbord dat toont, een gewone personenauto nooit.</desc>

