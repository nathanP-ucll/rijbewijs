<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Straat met zebrapad en drie genummerde zones (oefening)</title>
<desc id="d">Een straat met twee rijstroken en een zebrapad. Het verkeer rijdt rechts: in de onderste rijstrook naar rechts, in de bovenste naar links (aangeduid met pijlen). Langs de rijbaan zijn drie genummerde zones aangeduid: zone 1 ligt in de onderste strook links van het zebrapad op enige afstand, zone 2 in de onderste strook tegen het zebrapad aan, zone 3 in de bovenste strook tegen het zebrapad aan.</desc>
