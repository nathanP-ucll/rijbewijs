<title id="t">Van het huidige reglement naar nieuwe codes op 1 juni 2027</title>
<desc id="d">Een tijdlijn. Links: nu geldt het huidige verkeersreglement. Rechts: vanaf 1 juni 2027 komen een federale code en een Vlaamse, Brusselse en Waalse code. Voor een examen vandaag gelden de regels van nu; controleer vlak voor je examen welke code geldt.</desc>
